name: stepix
description: "Stepix — o'quv markazlari uchun mobil ilova (o'quvchi + o'qituvchi)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  go_router: ^14.6.1
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# `flutter pub run flutter_launcher_icons` regenerates every platform's icon
# from the one source file — the mark alone, not the wordmark: a launcher
# icon has no room for "Step" and "ix" to stay legible.
flutter_launcher_icons:
  image_path: assets/icon/stepix-icon.png
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled rather than fetched. `AppFonts` has always named these two families
  # — they are the template's — but nothing declared them, so every device fell
  # through to the fallback and the app rendered in Roboto and Georgia. A design
  # that depends on its typography has to ship it.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
